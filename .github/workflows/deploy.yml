
name: Deploy Portfolio to OCI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Angular Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Verify build output
        run: |
          test -f docs/index.html
          echo "Angular build output verified."

      - name: Package website
        run: tar -czf site.tar.gz -C docs .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload website package
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu

          scp -P "$SERVER_PORT" \
            site.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/tmp/portfolio-site.tar.gz"

      - name: Prepare deployment directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu

          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo install -d -o opc -g opc /usr/share/nginx/html/portfolio-website'

      - name: Deploy website
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -eu

          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            'set -eu
             sudo tar -tzf /tmp/portfolio-site.tar.gz >/dev/null
             tar -xzf /tmp/portfolio-site.tar.gz -C /usr/share/nginx/html/portfolio-website
             test -f /usr/share/nginx/html/portfolio-website/index.html
             rm -f /tmp/portfolio-site.tar.gz
             echo "Portfolio deployment completed successfully."'
